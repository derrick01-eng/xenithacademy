<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XENITH ACADEMY</title>
<meta name="description" content="Tutorials for WAEC, NECO, JAMB, Post-UTME and university exams.">
<meta property="og:title" content="XENITH ACADEMY">
<meta property="og:description" content="Tutorials for WAEC, NECO, JAMB, Post-UTME and university exams.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{
  --navy:#002151;--navy2:#001737;--red:#ce1010;--red2:#a80c0c;
  --mist:#f2f5fa;--line:#d9e0ec;--ink:#0d1b33;--mute:#5a6682;--ok:#157f3b;--warn:#8a5200;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Source Sans 3',system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:112px}
body{margin:0;font-family:var(--sans);color:var(--ink);background:#fff;line-height:1.6;-webkit-text-size-adjust:100%;font-size:17px}
body.lock{overflow:hidden}
img{max-width:100%;display:block}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px;position:relative;z-index:1}
h1,h2,h3{font-family:var(--serif);font-weight:700;color:var(--navy);line-height:1.15;margin:0}
.mute{color:var(--mute)}
.pad{padding-top:44px;padding-bottom:60px}

/* ---------- header ---------- */
header.bar{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line)}
.barin{display:flex;align-items:center;justify-content:space-between;gap:12px;height:62px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand img{height:50px;width:auto}
.brand span{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--navy);letter-spacing:.04em}
.hbtns{display:flex;gap:8px;align-items:center}
.ticker{overflow:hidden;background:var(--navy);padding:7px 0}
.tk{display:flex;width:max-content;animation:flow 22s linear infinite}
.tk:hover,.tk.hold{animation-play-state:paused}
.tkset{display:flex;gap:10px;padding-right:10px}
.rib{display:inline-block;text-decoration:none;white-space:nowrap;font-weight:600;font-size:14px;color:#fff;border:1.5px solid rgba(255,255,255,.55);border-radius:99px;padding:3px 15px}
.rib:hover{background:var(--red);border-color:var(--red)}
@keyframes flow{from{transform:translateX(-16.6667%)}to{transform:translateX(0)}}
@media (prefers-reduced-motion:reduce){.tk{animation:none}.ticker{overflow-x:auto}}
.banner{background:var(--red);color:#fff;text-align:center;padding:8px 16px;font-weight:600;font-size:15px}

/* ---------- buttons ---------- */
.btn{display:inline-block;border:0;border-radius:8px;padding:11px 20px;font-weight:700;cursor:pointer;text-decoration:none;background:var(--navy);color:#fff;text-align:center}
.btn:hover{background:var(--navy2)}
.btn.red{background:var(--red)}.btn.red:hover{background:var(--red2)}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn.ghost:hover{background:var(--mist)}
.btn.light{background:#fff;color:var(--navy)}.btn.light:hover{background:var(--mist)}
.btn.danger{background:#fde8e8;color:var(--red2)}
.btn.sm{padding:7px 13px;font-size:14px;border-radius:7px}
.btn[disabled]{opacity:.55;cursor:default}

/* ---------- hero ---------- */
.hero{position:relative;background:var(--navy);color:#fff;padding:64px 0 96px;overflow:hidden;clip-path:polygon(0 0,100% 0,100% 88%,0 100%)}
.hero:after{content:"";position:absolute;right:11%;top:-20%;width:4px;height:150%;background:var(--red);transform:rotate(24deg);z-index:0}
.hero h1{color:#fff;font-size:clamp(38px,9vw,70px);max-width:780px;letter-spacing:-.01em}
.hero p{font-size:clamp(17px,2.6vw,21px);max-width:600px;margin:18px 0 26px;color:#dbe4f5}
.hero .acts{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:28px}
.chips{display:flex;flex-wrap:wrap;gap:8px;max-width:640px}
.chip{border:1.5px solid rgba(255,255,255,.4);border-radius:99px;padding:3px 14px;font-weight:600;font-size:15px;color:#fff}

/* ---------- sections ---------- */
section.s{padding:60px 0}
section.s.alt{background:var(--mist)}
.sh{margin-bottom:28px;max-width:640px}
.sh h2{font-size:clamp(30px,5.5vw,42px)}
.sh p{margin:8px 0 0;color:var(--mute)}
.about p{max-width:680px;margin:0 0 16px}
.pull{border-left:4px solid var(--red);padding:4px 0 4px 18px;margin-top:26px;max-width:680px}
.pull p{font-family:var(--serif);font-size:clamp(24px,4.6vw,34px);color:var(--navy);font-weight:600;line-height:1.25;margin:0 0 6px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.empty{color:var(--mute);padding:22px;border:1.5px dashed var(--line);border-radius:10px;background:#fff}

/* how it works */
.steps{list-style:none;margin:0 0 34px;padding:0;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));counter-reset:s}
.steps li{counter-increment:s;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px 14px 56px;position:relative;font-weight:600}
.steps li:before{content:counter(s);position:absolute;left:14px;top:12px;width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-size:18px}
.steps small{display:block;font-weight:400;color:var(--mute)}

/* carousel (team) */
section.s,.hero{font-family:var(--sans)}
.cwrap{position:relative}
.ctrack{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:4px 2px 10px;-webkit-overflow-scrolling:touch}
.ctrack::-webkit-scrollbar{display:none}
.ctrack .pcard{flex:0 0 min(72vw,250px);scroll-snap-align:start}
.cnav{position:absolute;top:34%;z-index:3;width:40px;height:40px;border-radius:50%;border:0;background:#fff;color:var(--navy);font-size:20px;cursor:pointer;box-shadow:0 4px 14px rgba(0,23,55,.28)}
.cnav.l{left:-8px}.cnav.r{right:-8px}
.fprev{font-size:20px;margin-top:6px;color:var(--navy)}
@media(max-width:560px){.cnav{display:none}}
/* team */
.pcard{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pphoto{aspect-ratio:1/1;background:var(--mist);display:grid;place-items:center;font-family:var(--serif);font-size:56px;color:var(--navy)}
.pphoto img{width:100%;height:100%;object-fit:cover}
.pbody{padding:14px 16px 18px}
.pbody h3{font-size:24px}
.pbody .role{color:var(--red);font-weight:700;font-size:15px}
.pbody p{margin:8px 0 0;color:var(--mute);font-size:15px}

/* tutorials + mocks */
.tcard{background:#fff;border:1px solid var(--line);border-top:4px solid var(--navy);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:10px}
.tcard h3{font-size:26px}
.tcard .desc{margin:0;color:var(--mute);font-size:15px}
.tcard .sched{font-size:15px;font-weight:600}
.price{font-family:var(--serif);font-size:32px;font-weight:700;color:var(--navy)}
.price small{font-family:var(--sans);font-size:14px;color:var(--mute);font-weight:400}
.pay{background:var(--mist);border-radius:8px;padding:10px 12px;font-size:15px}
.pay b{display:block}
.acc{font-weight:700;letter-spacing:.04em;color:var(--navy)}
.tcard .btn{margin-top:auto}

/* contact */
.contacts{display:flex;flex-wrap:wrap;gap:12px}
.contacts a{display:flex;flex-direction:column;text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 18px;min-width:200px}
.contacts a:hover{border-color:var(--navy)}
.contacts small{color:var(--mute)}
.contacts b{color:var(--navy);word-break:break-all}
footer{background:var(--navy2);color:#b9c6df;padding:28px 0;font-size:15px;text-align:center}
footer a{color:#fff}

/* ---------- dashboard ---------- */
.h1{font-size:clamp(32px,6vw,46px)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0 8px;max-width:560px}
.stat{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff}
.stat b{display:block;font-family:var(--serif);font-size:34px;color:var(--navy);line-height:1}
.stat span{font-size:14px;color:var(--mute)}
.dsec{margin-top:38px}
.dsec h2{font-size:30px;margin-bottom:14px}
.dsec .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.dsec .row h2{margin:0}
.rcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
.rcard .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rcard h3{font-size:24px}
.rcard .meta{color:var(--mute);font-size:15px;margin-top:2px}
.rcard .note{background:var(--mist);border-radius:8px;padding:8px 12px;margin-top:10px;font-size:15px}
.rcard .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.rthumb{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.st{display:inline-block;border-radius:99px;padding:2px 12px;font-size:14px;font-weight:700;white-space:nowrap}
.st.pending,.st.requested{background:#fff1d6;color:var(--warn)}
.st.approved{background:#dcf5e5;color:var(--ok)}
.st.rejected{background:#fde8e8;color:var(--red2)}
.st.completed{background:#e0e8f7;color:var(--navy)}
.tl{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 18px 16px}
.tl li:before{content:"";position:absolute;left:-25px;top:6px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--navy)}
.tl .d{font-size:14px;color:var(--mute)}

/* mocks and quizzes */
.mgroup{margin-top:34px}
.mgroup>h3{font-size:30px}
.mgroup>p{margin:4px 0 16px}
.kbadge{align-self:flex-start;border:1.5px solid var(--navy);color:var(--navy);border-radius:99px;padding:0 11px;font-size:13px;font-weight:700}
.mbox.wide{max-width:760px}
.qprog{position:sticky;top:-24px;background:#fff;padding:8px 0;font-weight:700;color:var(--navy);border-bottom:1px solid var(--line);margin:10px 0 4px;z-index:2}
.qq{border:1px solid var(--line);border-radius:10px;margin:14px 0 0;padding:10px 14px 12px}
.qq legend{font-weight:700;padding:0 6px;color:var(--ink)}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:8px;cursor:pointer}
.opt:hover{background:var(--mist)}
.opt input{margin-top:5px}
.qres{display:flex;align-items:baseline;gap:14px;margin:6px 0 14px}
.qres b{font-family:var(--serif);font-size:56px;color:var(--navy);line-height:1}
.qres span{font-size:24px;font-weight:700;color:var(--red)}
.qrev{border-left:5px solid var(--line);background:var(--mist);border-radius:8px;padding:10px 14px;margin-top:10px;font-size:16px}
.qrev.ok{border-left-color:var(--ok)}.qrev.bad{border-left-color:var(--red)}
.qrev .qt{font-weight:700;margin-bottom:4px}
.orow{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.orow .in{flex:1}
/* ---------- modal, forms, toast ---------- */
#modal{position:fixed;inset:0;background:rgba(0,23,55,.66);display:none;align-items:flex-start;justify-content:center;z-index:60;padding:20px 14px;overflow-y:auto}
#modal.on{display:flex}
.mbox{background:#fff;border-radius:12px;max-width:520px;width:100%;padding:24px 22px 26px;position:relative;margin:auto 0}
.mx{position:absolute;right:10px;top:8px;border:0;background:none;font-size:30px;line-height:1;cursor:pointer;color:var(--mute)}
.mbox h2{font-size:30px;margin-bottom:6px}
.mtabs{display:flex;gap:6px;margin:12px 0 4px}
.mtabs button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:9px;font-weight:700;cursor:pointer;color:var(--mute)}
.mtabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
label.f{display:block;font-size:14px;font-weight:700;margin:14px 0 5px;color:var(--ink)}
.in{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;background:#fff;font-size:16px}
.in:focus{border-color:var(--navy);outline:none}
textarea.in{min-height:80px;resize:vertical}
.err{color:var(--red2);font-size:15px;min-height:22px;margin-top:8px;font-weight:600}
.hint{font-size:14px;color:var(--mute);margin:6px 0 0}
.rprev{margin-top:10px;max-height:180px;border-radius:8px;border:1px solid var(--line)}
.paybox{background:var(--mist);border-radius:8px;padding:12px 14px;margin-top:12px;font-size:15px}
.mopt{display:block;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px;cursor:pointer}
.mopt input{margin-right:8px}
.mopt.on{border-color:var(--navy);background:var(--mist)}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);background:var(--navy2);color:#fff;padding:12px 18px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:all .3s;z-index:90;max-width:92vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#lb{position:fixed;inset:0;background:rgba(0,10,30,.92);display:none;align-items:center;justify-content:center;z-index:100;padding:16px;cursor:zoom-out}
#lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.demo{background:#fff1d6;color:var(--warn);font-size:14px;padding:8px 14px;text-align:center}

/* ---------- admin ---------- */
#admin{display:none;background:var(--mist);min-height:100vh;padding-bottom:100px}
.gate{max-width:420px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:26px}
.abar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.abar .wrap{display:flex;gap:10px;align-items:center;height:60px}
.abar h1{font-size:24px;flex:1}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:none}
.tabs button{flex:none;border:1.5px solid var(--line);background:#fff;color:var(--mute);font-weight:700;padding:8px 14px;border-radius:99px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tabs i{font-style:normal;background:var(--red);color:#fff;border-radius:99px;padding:0 7px;margin-left:6px;font-size:13px}
.item{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;margin:12px 0}
.item .hd{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.item .hd b{flex:1;color:var(--navy);font-size:18px}
.chipbar{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chipbar button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:5px 13px;font-weight:700;color:var(--mute);cursor:pointer}
.chipbar button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.arow{display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.lg{display:flex;align-items:center;gap:12px}
.lp{width:64px;height:64px;border-radius:10px;background:var(--mist);border:1px solid var(--line);object-fit:contain;flex:none}
.ph0{display:grid;place-items:center;font-size:12px;color:var(--mute);text-align:center}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);padding:10px 0}
.savebar .wrap{display:flex;gap:10px;align-items:center}
.savebar .msgs{flex:1;font-size:14px;color:var(--mute);min-width:0}
.meter{font-size:13px}.meter.warn{color:var(--warn)}.meter.bad{color:var(--red2);font-weight:700}
@media(max-width:560px){.stats{grid-template-columns:repeat(3,1fr)}.brand span{font-size:20px}}
</style>
</head>
<body>

<!-- ======================= STUDENT SITE ======================= -->
<div id="site">
  <div id="demoBar" class="demo" style="display:none"></div>
  <header class="bar">
    <div class="wrap barin">
      <a class="brand" href="#top" id="brand"></a>
      <div class="hbtns"><button class="btn red sm" id="authBtn">Student login</button></div>
    </div>
    <div class="ticker"><div class="tk" id="tk"></div></div>
  </header>
  <div id="banner" class="banner" style="display:none"></div>
  <div id="top"></div>
  <main id="viewHome"></main>
  <main id="viewDash" style="display:none"></main>
  <footer><div class="wrap"><span id="fText"></span> · <a href="#admin">Admin</a></div></footer>
</div>

<!-- ======================= ADMIN ======================= -->
<div id="admin">
  <div id="aGate"></div>
  <div id="aApp" style="display:none">
    <div class="abar"><div class="wrap">
      <h1>Admin panel</h1>
      <a class="btn ghost sm" href="#" id="aView">View site</a>
      <button class="btn ghost sm" id="aOut">Log out</button>
    </div></div>
    <div class="wrap">
      <div class="tabs" id="aTabs"></div>
      <div id="aPanel"></div>
    </div>
    <div class="savebar" id="aSave"><div class="wrap"><div class="msgs"><div id="saveMsg">Changes go live when you press Save.</div><div class="meter" id="meter"></div></div><button class="btn red" id="saveBtn">Save and publish</button></div></div>
  </div>
</div>

<div id="modal"><div class="mbox"><button class="mx" id="mclose" aria-label="Close">×</button><div id="mbody"></div></div></div>
<div id="lb" aria-hidden="true"></div>
<div id="toast" role="status"></div>

<script type="module">
/* =========================================================

const FIREBASE_CONFIG = {

  messagingSenderId: "141524836195",

    async add(c,o){ const id="d"+uid8(); db[c].push({...clean(o),id}); return id; },
    async upd(c,id,p){ Object.assign(db[c].find(x=>x.id===id),clean(p)); },
    async del(c,id){ db[c]=db[c].filter(x=>x.id!==id); },
    async get(c,id){ const r=db[c].find(x=>x.id===id); return r?clean(r):null; },
    async set(c,id,o){ const i=db[c].findIndex(x=>x.id===id); const v={...clean(o),id}; if(i>=0) db[c][i]=v; else db[c].push(v); }
  };
}
async function firebaseBackend(){
  const base="https://www.gstatic.com/firebasejs/10.12.2/";
  const [{initializeApp},fs,au]=await Promise.all([import(base+"firebase-app.js"),import(base+"firebase-firestore.js"),import(base+"firebase-auth.js")]);
  const app=initializeApp(FIREBASE_CONFIG), db=fs.getFirestore(app), auth=au.getAuth(app);
  const U=u=>u?{uid:u.uid,email:u.email,name:u.displayName||""}:null;
  const rows=s=>s.docs.map(d=>({id:d.id,...d.data()}));
  return {
    mode:"firebase",
    async getSite(){ const s=await fs.getDoc(fs.doc(db,"site","main")); return s.exists()?s.data():null; },
    saveSite:d=>fs.setDoc(fs.doc(db,"site","main"),clean(d)),
    async getCfg(){ try{ const s=await fs.getDoc(fs.doc(db,"admin","config")); return s.exists()?s.data():{}; }catch{ return {}; } },
    saveCfg:d=>fs.setDoc(fs.doc(db,"admin","config"),clean(d)),
    onAuth(cb){ au.onAuthStateChanged(auth,u=>cb(U(u))); },
    async signUp(email,pw,name,phone){
      const c=await au.createUserWithEmailAndPassword(auth,email,pw);
      try{ await au.updateProfile(c.user,{displayName:name}); }catch(e){ console.warn(e); }
      try{ await fs.setDoc(fs.doc(db,"users",c.user.uid),{name,phone,email,createdAt:Date.now()}); }catch(e){ console.warn(e); }
      return {uid:c.user.uid,email:c.user.email,name};
    },
    signIn:(e,p)=>au.signInWithEmailAndPassword(auth,e,p),
    signOut:()=>au.signOut(auth),
    reset:e=>au.sendPasswordResetEmail(auth,e),
    async getProfile(uid){ try{ const s=await fs.getDoc(fs.doc(db,"users",uid)); return s.exists()?s.data():null; }catch{ return null; } },
    setProfile:(uid,o)=>fs.setDoc(fs.doc(db,"users",uid),o,{merge:true}),
    async listBy(c,uid){ return rows(await fs.getDocs(fs.query(fs.collection(db,c),fs.where("uid","==",uid)))); },
    async listAll(c){ return rows(await fs.getDocs(fs.collection(db,c))); },
    async add(c,o){ return (await fs.addDoc(fs.collection(db,c),clean(o))).id; },
    upd:(c,id,p)=>fs.updateDoc(fs.doc(db,c,id),clean(p)),
    del:(c,id)=>fs.deleteDoc(fs.doc(db,c,id)),
    async get(c,id){ const sn=await fs.getDoc(fs.doc(db,c,id)); return sn.exists()?sn.data():null; },
    set:(c,id,o)=>fs.setDoc(fs.doc(db,c,id),clean(o))
  };
}

function authMsg(e){
  const c=(e&&e.code)||"";
  if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c)) return "Wrong email or password. Check them and try again.";
  if(/email-already-in-use/.test(c)) return "That email already has an account. Log in instead.";
  if(/weak-password/.test(c)) return "Use a password with at least 6 characters.";
  if(/invalid-email/.test(c)) return "That email address doesn't look right.";
  if(/network/.test(c)) return "No internet connection. Check your network and try again.";
  if(/too-many/.test(c)) return "Too many attempts. Wait a few minutes and try again.";
  return "Something went wrong. Try again.";
}

  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      if(!img.width||!img.height){ URL.revokeObjectURL(url); return rej(new Error("size")); }
      const s=Math.min(1,P.max/Math.max(img.width,img.height)), w=Math.round(img.width*s), h=Math.round(img.height*s);
      const c=document.createElement("canvas"); c.width=w; c.height=h; const x=c.getContext("2d");
      if(P.fill){ x.fillStyle=P.fill; x.fillRect(0,0,w,h); } x.drawImage(img,0,0,w,h); URL.revokeObjectURL(url);
      let out=c.toDataURL(P.fmt,P.q); if(mode==="logo"&&!out.startsWith("data:image/webp")) out=c.toDataURL("image/png");
      if(out.length>800000) return rej(new Error("big"));
      res(out);
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error("load")); }; img.src=url;
  });
}

/* ---------- fonts (free Google Fonts) and design ---------- */
const FONTS={"Cormorant Garamond":"500;600;700","Source Sans 3":"400;600;700","Playfair Display":"400;600;700;800","Montserrat":"400;600;700;800","Poppins":"400;600;700;800","Inter":"400;600;700;800","Lora":"400;600;700","Merriweather":"400;700","Raleway":"400;600;700;800","Nunito":"400;600;700;800","DM Sans":"400;600;700","Roboto Slab":"400;600;700;800","Oswald":"400;600;700","Space Grotesk":"400;500;600;700","Outfit":"400;600;700;800","Sora":"400;600;700;800","Manrope":"400;600;700;800","Bebas Neue":"","Pacifico":"","Archivo Black":""};
const DSECS=[["home","Home banner"],["about","About"],["team","Team"],["tutorials","Tutorials"],["mocks","Mock exams"],["contact","Contact"]];
const fontsLoaded=new Set();
function loadFonts(names){
  names.forEach(n=>{ if(!n||!(n in FONTS)||fontsLoaded.has(n)) return; fontsLoaded.add(n);
    const w=FONTS[n], l=document.createElement("link"); l.rel="stylesheet";
    l.href="https://fonts.googleapis.com/css2?family="+n.replace(/ /g,"+")+(w?":wght@"+w:"")+"&display=swap"; document.head.appendChild(l); });
}
const fam=n=>`'${n}',Georgia,system-ui,sans-serif`;
function applyDesign(){
  if(!site) return;
  const f=site.fonts||{}, sec=f.sec||{}, rs=document.documentElement.style;
  loadFonts([f.heading,f.body,...Object.values(sec)].filter(Boolean));
  if(f.heading) rs.setProperty("--serif",fam(f.heading)); else rs.removeProperty("--serif");
  if(f.body) rs.setProperty("--sans",fam(f.body)); else rs.removeProperty("--sans");
  DSECS.forEach(([k])=>{ const el=document.getElementById(k); if(!el) return;
    if(sec[k]&&(sec[k] in FONTS)){ el.style.setProperty("--serif",fam(sec[k])); el.style.setProperty("--sans",fam(sec[k])); }
    else { el.style.removeProperty("--serif"); el.style.removeProperty("--sans"); } });
}
/* sliding carousel for the team: swipe, arrows, auto-advance */
function startCarousels(){
  const box=$("#teamBox"); if(!box) return;
  const tr=box.querySelector(".ctrack"); let pause=0;
  const stepW=()=>{ const c=tr.querySelector(".pcard"); return c?c.offsetWidth+16:260; };
  const next=()=>{ if(tr.scrollWidth<=tr.clientWidth+4) return; const end=tr.scrollLeft+tr.clientWidth>=tr.scrollWidth-4; tr.scrollTo({left:end?0:tr.scrollLeft+stepW(),behavior:"smooth"}); };
  box.querySelector(".cnav.l").onclick=()=>{ pause=Date.now()+8000; tr.scrollTo({left:Math.max(0,tr.scrollLeft-stepW()),behavior:"smooth"}); };
  box.querySelector(".cnav.r").onclick=()=>{ pause=Date.now()+8000; next(); };
  ["touchstart","mousedown","wheel"].forEach(ev=>tr.addEventListener(ev,()=>{pause=Date.now()+8000},{passive:true}));
  tr.addEventListener("mouseenter",()=>{pause=Date.now()+8000});
  carTimers.push(setInterval(()=>{ if(Date.now()>=pause&&view==="home") next(); },3500));
}

/* online quizzes */
async function startQuiz(mid){
  if(!me) return openAuth(()=>startQuiz(mid));
  if(!studentOnly()) return;
  const m=site.mocks.find(x=>x.id===mid); if(!m) return;
  try{
    if(needPaid(m)&&!(await hasPaid())) return paidModal();
    const subs=await B.listBy("quizsubs",me.uid);
    if(subs.some(x=>x.mockId===m.id)){ toast("You've already taken this quiz. Your result is on your dashboard."); return; }
    const names=await unfinishedNames(); if(names.length) return blockedModal(names);
    const qz=await B.get("quizzes",m.id), qs=(qz&&qz.questions)||[];
    if(!qs.length){ toast("This quiz isn't ready yet. Please check back soon."); return; }
    quizState={m,qs,ans:qs.map(()=>-1)}; drawQuiz();
  }catch(e){ console.warn(e); toast("We couldn't start the quiz. Check your connection and try again."); }
}
function drawQuiz(){
  const {m,qs}=quizState;
  modal(`<h2>${esc(m.name)}</h2><p class="hint" style="margin:0">Answer every question, then submit. You can only take this quiz once. You'll see your score and the correct answers after you submit.</p>
    <div class="qprog" id="qProg">0 of ${qs.length} answered</div>
    ${qs.map((q,i)=>`<fieldset class="qq"><legend>${i+1}. ${esc(q.q)}</legend>${q.options.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}"><span>${esc(o)}</span></label>`).join("")}</fieldset>`).join("")}
    <div class="err" id="qErr"></div><button class="btn red" style="width:100%;margin-top:8px" id="qSubmit">Submit quiz</button>`,true);
}
async function submitQuiz(){
  const {m,qs,ans}=quizState, err=$("#qErr"), go=$("#qSubmit"); err.textContent="";
  const left=ans.filter(a=>a<0).length;
  if(left&&!confirm(`You left ${left} question${left>1?"s":""} unanswered. Submit anyway?`)) return;
  go.disabled=true;
  try{ await B.set("quizsubs",me.uid+"_"+m.id,{uid:me.uid,email:me.email,studentName:studentName(),mockId:m.id,mockName:m.name,answers:ans,count:qs.length,submittedAt:Date.now()}); }
  catch(e){ console.warn(e); err.textContent="We couldn't submit. You may have already submitted this quiz, or your connection dropped."; go.disabled=false; return; }
  let key=null; try{ key=await B.get("quizkeys",m.id); }catch(e){ console.warn(e); }
  quizState=null; showQuizResult(m,qs,ans,key);
}
function showQuizResult(m,qs,ans,key){
  const k=(key&&key.answers)||null;
  if(!k){ modal(`<h2>Submitted</h2><p>Your answers were saved. Your result will show on your dashboard soon.</p><a class="btn red" style="width:100%" href="#dashboard" id="gDash">Go to my dashboard</a>`); return; }
  const correct=qs.filter((q,i)=>ans[i]===k[i]).length, pct=qs.length?Math.round(correct/qs.length*100):0;
  modal(`<h2>${esc(m.name)}</h2><div class="qres"><b>${correct}/${qs.length}</b><span>${pct}%</span></div>
    ${qs.map((q,i)=>{ const ok=ans[i]===k[i]; return `<div class="qrev ${ok?"ok":"bad"}"><div class="qt">${i+1}. ${esc(q.q)}</div>
      <div>Your answer: ${ans[i]>=0&&q.options[ans[i]]!==undefined?esc(q.options[ans[i]]):"Not answered"}</div>${ok?"":`<div>Correct answer: <b>${esc(q.options[k[i]])}</b></div>`}</div>`; }).join("")}
    <a class="btn red" style="width:100%;margin-top:14px" href="#dashboard" id="gDash">Go to my dashboard</a>`,true);
}
async function reviewQuiz(mid){
  try{
    const subs=await B.listBy("quizsubs",me.uid), sub=subs.find(x=>x.mockId===mid); if(!sub) return;
    const qz=await B.get("quizzes",mid), key=await B.get("quizkeys",mid), m=site.mocks.find(x=>x.id===mid)||{name:sub.mockName};
    showQuizResult(m,(qz&&qz.questions)||[],sub.answers||[],key);
  }catch(e){ console.warn(e); toast("We couldn't load your review. Try again."); }
}

  const link=($("#qk-"+id)||{}).value||"", note=($("#qn-"+id)||{}).value||"";
  if(act==="delete"){ if(!confirm("Delete this request permanently?")) return; await B.del("mockreqs",id); }
  else{
    const patch={updatedAt:Date.now(),note};
    if(act==="approve"||act==="update"){ if(!link.trim()){ toast("Add the mock exam link first."); return; } patch.link=link.trim(); if(act==="approve") patch.status="approved"; }
    if(act==="reject"){ patch.status="rejected"; }
    await B.upd("mockreqs",id,patch);
  }
  toast(act==="approve"?"Approved. The student can now open the link.":act==="delete"?"Deleted.":"Updated.");
  await loadAdminLists(); renderAdmin();
}

/* ---- quiz builder ---- */
async function ensureQb(id){
  if(qbData[id]) return;
  let qz=null,key=null; try{ qz=await B.get("quizzes",id); key=await B.get("quizkeys",id); }catch(e){ console.warn(e); }
  const qs=(qz&&qz.questions)||[], ans=(key&&key.answers)||[];
  qbData[id]={questions:qs.map((q,i)=>({q:q.q||"",options:[...(q.options||[])],correct:Number.isInteger(ans[i])?ans[i]:-1})),dirty:false};
}
function parseQuestions(text){
  const out=[];
  String(text).replace(/\r/g,"").split(/\n\s*\n/).forEach(block=>{
    const lines=block.split("\n").map(l=>l.trim()).filter(Boolean); if(!lines.length) return;
    const q=[], opts=[]; let correct=-1;
    lines.forEach(l=>{
      let m=l.match(/^answer\s*[:\-]\s*\(?([A-Ha-h])\)?\s*$/i);
      if(m){ correct=m[1].toUpperCase().charCodeAt(0)-65; return; }
      m=l.match(/^\(?([A-Ha-h])[\).:]\s*(.+)$/);
      if(m){ let t=m[2].trim(); if(/\*\s*$/.test(t)){ t=t.replace(/\s*\*+\s*$/,""); correct=opts.length; } opts.push(t); return; }
      if(!opts.length) q.push(l.replace(/^(?:q(?:uestion)?\s*)?\d+\s*[\).:\-]\s*/i,"").replace(/^q\s*[:\-]\s*/i,"")); else opts[opts.length-1]+=" "+l;
    });
    if(q.length&&opts.length>=2) out.push({q:q.join(" "),options:opts,correct:correct<opts.length?correct:-1});
  });
  return out;
}
function validateQb(){
  for(const [id,qd] of Object.entries(qbData)){
    if(!qd.dirty) continue; const name=(site.mocks.find(m=>m.id===id)||{}).name||"Quiz";
    for(let i=0;i<qd.questions.length;i++){ const q=qd.questions[i];
      if(!q.q.trim()) return `${name}: question ${i+1} is empty.`;
      if(q.options.length<2||q.options.some(o=>!o.trim())) return `${name}: question ${i+1} needs at least two options and none can be blank.`;
      if(!(q.correct>=0&&q.correct<q.options.length)) return `${name}: tick the correct answer for question ${i+1}.`; }
  }
  return "";
}

  const quizzes=site.mocks.filter(m=>kindOf(m)==="quiz");
  if(!quizzes.length) return `<div class="item">No quizzes yet. In <b>Mock exams</b>, add a mock, set its type to <b>Online quiz</b> and save. Then come back here to add the questions.</div>`;
  if(!quizzes.some(m=>m.id===qbSel)) qbSel=quizzes[0].id;
  const pick=`<div class="item"><label class="f">Quiz</label><select class="in" data-qbsel="1">${quizzes.map(m=>`<option value="${esc(m.id)}"${m.id===qbSel?" selected":""}>${esc(m.name||"Untitled quiz")}</option>`).join("")}</select></div>`;

  return pick+`<div class="item"><b style="color:var(--navy)">Paste questions</b>
    <textarea class="in" id="qbPaste" style="min-height:140px" placeholder="1. What is 7 x 8?\nA) 54\nB) 56*\nC) 58\nD) 64"></textarea>

    <button class="btn ghost sm" style="margin-top:8px" data-qimport="1">Add these questions</button></div>`
  +qd.questions.map((q,i)=>`<div class="item"><div class="hd"><b>Question ${i+1}</b>
      <button class="btn ghost sm" data-qmv="${i}:-1">Up</button><button class="btn ghost sm" data-qmv="${i}:1">Down</button><button class="btn danger sm" data-qdel="${i}">Delete</button></div>
    <textarea class="in" data-qq="${i}">${esc(q.q)}</textarea>
    <label class="f">Options (tick the correct answer)</label>
    ${q.options.map((o,j)=>`<div class="orow"><input type="radio" name="qc${i}" data-qc="${i}:${j}"${q.correct===j?" checked":""} aria-label="Correct answer"><input class="in" data-qo="${i}:${j}" value="${esc(o)}" placeholder="Option ${String.fromCharCode(65+j)}"><button class="btn danger sm" data-odel="${i}:${j}">Remove</button></div>`).join("")}
    <button class="btn ghost sm" data-oadd="${i}">Add option</button></div>`).join("")
  +`<button class="btn red" data-qadd="1">Add a question</button><p class="hint">${qd.questions.length} question${qd.questions.length===1?"":"s"}. Press Save and publish when you're done. Students can't see the answers until they submit.</p>`;
}

function targetOf(ul,ui){ return ul==="brand"?site.brand:site[ul][+ui]; }
function bindAdmin(){
  const root=$("#aPanel");
  root.oninput=e=>{
    const t=e.target, d=t.dataset;
    if(d.qq!==undefined){ const qd=qbData[qbSel]; qd.questions[+d.qq].q=t.value; qd.dirty=true; markDirty(); }
    else if(d.qo!==undefined){ const [i,j]=d.qo.split(":").map(Number), qd=qbData[qbSel]; qd.questions[i].options[j]=t.value; qd.dirty=true; markDirty(); }
    else if(d.qc!==undefined){ const [i,j]=d.qc.split(":").map(Number), qd=qbData[qbSel]; qd.questions[i].correct=j; qd.dirty=true; markDirty(); }
    else if(t.id==="rSq"){ resQ=t.value; drawResults(); }
    else if(d.fg){ site.fonts[d.fg]=t.value; previewFont(t); applyDesign(); markDirty(); }
    else if(d.fs){ site.fonts.sec[d.fs]=t.value; previewFont(t); applyDesign(); markDirty(); }
    else if(d.b){ site.brand[d.b]=t.value; markDirty(); }
    else if(d.s){ site.settings[d.s]= d.s==="mockNeedsPayment"?t.value==="true":t.value; markDirty(); }
    else if(d.cfg){ cfg[d.cfg][d.ck]=t.value; markDirty(); }
    else if(d.l){ site[d.l][+d.i][d.k]= d.k==="paidOnly"?t.value==="true":t.value; markDirty(); }
    else if(t.id==="rSearch"){ rQ=t.value; drawReceiptList(); }
  };
  root.onchange=async e=>{
    const t=e.target, d=t.dataset;
    if(d.up&&t.files[0]){
      $("#saveMsg").textContent="Preparing image...";
      try{ targetOf(d.ul,d.ui)[d.uf]=await resizeImage(t.files[0],d.up); markDirty(); renderAdmin(); }
      catch{ $("#saveMsg").textContent="Could not use that image. Try a PNG or JPG."; }
    }
    if(t.dataset.l==="tutorials"&&t.dataset.k==="accountId") markDirty();
    if(t.dataset.l==="mocks"&&t.dataset.k==="kind") renderAdmin();
    if(t.dataset.qbsel!==undefined){ qbSel=t.value; renderAdmin(); }
  };
  root.onclick=async e=>{
    const b=e.target.closest("button"); if(!b) return; const d=b.dataset;
    if(d.refresh){ await refreshAdmin(true); }
    else if(d.rsf){ resFilter=d.rsf; renderAdmin(); }
    else if(d.rdel){ const k=d.rdel.indexOf(":"), coll=d.rdel.slice(0,k), id=d.rdel.slice(k+1); if(confirm("Delete this entry?")){ await B.del(coll,id); for(const q of aProofs.filter(q=>q.refColl===coll&&q.refId===id)){ try{ await B.del("proofs",q.id); }catch(e){} } await loadAdminLists(); renderAdmin(); toast("Deleted."); } }
    else if(d.qb){ qbSel=d.qb; aTab="quiz"; renderAdmin(); }
    else if(d.qimport){ const qd=qbData[qbSel], items=parseQuestions(($("#qbPaste")||{}).value||""); if(!items.length) toast("No questions found. Check the format."); else { qd.questions.push(...items); qd.dirty=true; markDirty(); renderAdmin(); toast(items.length+" question"+(items.length>1?"s":"")+" added."); } }
    else if(d.qadd){ const qd=qbData[qbSel]; qd.questions.push({q:"",options:["","","",""],correct:-1}); qd.dirty=true; markDirty(); renderAdmin(); }
    else if(d.qdel!==undefined){ if(confirm("Delete this question?")){ const qd=qbData[qbSel]; qd.questions.splice(+d.qdel,1); qd.dirty=true; markDirty(); renderAdmin(); } }
    else if(d.qmv){ const [i,dir]=d.qmv.split(":").map(Number), a=qbData[qbSel].questions, j=i+dir; if(j>=0&&j<a.length){ [a[i],a[j]]=[a[j],a[i]]; qbData[qbSel].dirty=true; markDirty(); renderAdmin(); } }
    else if(d.oadd!==undefined){ const qd=qbData[qbSel]; qd.questions[+d.oadd].options.push(""); qd.dirty=true; markDirty(); renderAdmin(); }
    else if(d.odel){ const [i,j]=d.odel.split(":").map(Number), qd=qbData[qbSel], q=qd.questions[i]; if(q.options.length<=2) toast("A question needs at least two options."); else { q.options.splice(j,1); if(q.correct===j) q.correct=-1; else if(q.correct>j) q.correct--; qd.dirty=true; markDirty(); renderAdmin(); } }
    else if(d.rf){ rFilter=d.rf; renderAdmin(); }
    else if(d.qf){ qFilter=d.qf; renderAdmin(); }
    else if(d.ra){ b.disabled=true; await regAction(d.ra,d.id); }
    else if(d.qa){ b.disabled=true; await mockAction(d.qa,d.id); }
    else if(d.add){ site[d.add].push(JSON.parse(d.blank)); markDirty(); renderAdmin(); }
    else if(d.del){ const [k,i]=d.del.split(":"); if(confirm("Delete this?")){ site[k].splice(+i,1); markDirty(); renderAdmin(); } }
    else if(d.mv){ const [k,i,dir]=d.mv.split(":"), a=site[k], j=+i+ +dir; if(j>=0&&j<a.length){ [a[+i],a[j]]=[a[j],a[+i]]; markDirty(); renderAdmin(); } }
    else if(d.rm){ const [ul,ui,uf]=d.rm.split("|"); targetOf(ul,ui)[uf]=""; markDirty(); renderAdmin(); }
  };
}
function usageBytes(){ return JSON.stringify(site).length; }
function updateMeter(){
  const m=$("#meter"); if(!m) return; const n=usageBytes();
  m.textContent=`Storage used: ${Math.round(n/1024)} KB of about 1000 KB`+(n>1000000?" (too much: remove or shrink some images)":n>800000?" (getting full)":"");
  m.className="meter"+(n>1000000?" bad":n>800000?" warn":"");
}
function markDirty(){ $("#saveMsg").textContent="Unsaved changes. Press Save and publish."; updateMeter(); }
async function saveAll(){
  const msg=$("#saveMsg"), btn=$("#saveBtn"); btn.disabled=true; msg.textContent="Saving...";
  try{
    if(JSON.stringify(site).length>1000000){ msg.textContent="Too much image data to save. Remove or shrink some images."; btn.disabled=false; return; }
    const bad=validateQb(); if(bad){ msg.textContent=bad; btn.disabled=false; return; }
    await B.saveSite(site); await B.saveCfg(cfg);
    for(const [id,qd] of Object.entries(qbData)){
      if(!qd.dirty) continue;
      await B.set("quizzes",id,{questions:qd.questions.map(q=>({q:q.q.trim(),options:q.options.map(o=>o.trim())})),updatedAt:Date.now()});
      await B.set("quizkeys",id,{answers:qd.questions.map(q=>q.correct),updatedAt:Date.now()});
      qd.dirty=false;
    }
    msg.textContent=B.mode==="demo"?"Demo mode: updated here only, not saved.":"Saved. Your site is updated.";
  }catch(e){ console.error(e); msg.textContent="Could not save: "+(e.message||"check your Firestore rules."); }
  btn.disabled=false; updateMeter();
}

/* =========================================================

   GLOBAL EVENTS

document.addEventListener("click",async e=>{
  const t=e.target, c=t.closest?t.closest.bind(t):()=>null;
  if(t.id==="mclose"||t.id==="modal"){ closeModal(); return; }
  if(c("#lb")){ const lb=$("#lb"); lb.style.display="none"; lb.textContent=""; return; }
  if(t.matches&&t.matches("img.zoom")){ const lb=$("#lb"); lb.textContent=""; const i=document.createElement("img"); i.src=t.src; i.alt=""; lb.appendChild(i); lb.style.display="flex"; return; }
  const am=c("[data-am]"); if(am){ authMode=am.dataset.am; drawAuth(); return; }
  if(t.id==="aGo"){ doAuth(); return; }
  if(t.id==="aForgot"){ e.preventDefault(); doForgot(); return; }
  if(t.id==="rGo"){ submitReg(); return; }
  if(t.id==="mGo"){ submitMock(); return; }
  if(t.id==="pGo"){ submitProof(); return; }
  if(t.id==="qSubmit"){ submitQuiz(); return; }
  if(t.id==="gDash"){ closeModal(); if(location.hash==="#dashboard") setTimeout(showDash,0); return; }
  const mo2=c("[data-mopen]"); if(mo2){ openOpenMock(mo2.dataset.mopen); return; }
  const qzb=c("[data-quiz]"); if(qzb){ startQuiz(qzb.dataset.quiz); return; }
  const pfb=c("[data-proof]"); if(pfb){ const [coll,id]=pfb.dataset.proof.split(":"); openProof(coll,id); return; }
  const rvb=c("[data-review]"); if(rvb){ reviewQuiz(rvb.dataset.review); return; }
  if(t.id==="dOut"){ e.preventDefault(); await B.signOut(); location.hash=""; if(view!=="home") route(); return; }
  const rg=c("[data-reg]"); if(rg){ openRegister(rg.dataset.reg); return; }
  const mk=c("[data-mock]"); if(mk){ openMock(mk.dataset.mock); return; }
  const cp=c("[data-copy]"); if(cp){ try{ await navigator.clipboard.writeText(cp.dataset.copy); toast("Account number copied."); }catch{ toast("Copy it manually: "+cp.dataset.copy); } return; }
  const mo=c(".mopt"); if(mo){ const inp=mo.querySelector("input"); if(inp){ mockPick=inp.value; document.querySelectorAll(".mopt").forEach(x=>x.classList.toggle("on",x===mo)); } }
  const tb=c("#aTabs button"); if(tb){ aTab=tb.dataset.t; if(["receipts","mockreqs","results"].includes(aTab)) await refreshAdmin(true,true); else renderAdmin(); return; }
});
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.id==="rT"){ regTid=t.value; drawRegPay(); }
  else if(t.id==="rFile"&&t.files[0]){ const err=$("#rErr"); err.textContent="";
    try{ regReceipt=await resizeImage(t.files[0],"receipt"); const p=$("#rPrev"); p.src=regReceipt; p.style.display="block"; }
    catch{ regReceipt=""; err.textContent="We couldn't read that image. Try a clearer photo or screenshot."; } }
  else if(t.dataset&&t.dataset.reup&&t.files[0]){ reupload(t.dataset.reup,t.files[0]); }
  else if(t.id==="pFile"&&t.files[0]){ const err=$("#pErr"); err.textContent="";
    try{ proofImg=await resizeImage(t.files[0],"receipt"); const p=$("#pPrev"); p.src=proofImg; p.style.display="block"; }
    catch{ proofImg=""; err.textContent="We couldn't read that image. Try a clearer screenshot."; } }
  else if(t.type==="radio"&&/^q\d+$/.test(t.name)&&quizState){ quizState.ans[+t.name.slice(1)]=+t.value; const n=quizState.ans.filter(a=>a>=0).length; $("#qProg").textContent=`${n} of ${quizState.qs.length} answered`; }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ closeModal(); const lb=$("#lb"); lb.style.display="none"; lb.textContent=""; }
  if(e.key==="Enter"&&(e.target.id==="aEmail"||e.target.id==="aPass"||e.target.id==="aName"||e.target.id==="aPhone")) doAuth();
});
$("#authBtn").onclick=()=>{ if(isAdmin) location.hash="#admin"; else if(me) location.hash="#dashboard"; else openAuth(()=>{ location.hash="#dashboard"; if(view==="dash") showDash(); }); };
$("#aView").onclick=e=>{ e.preventDefault(); location.hash=""; if(view!=="home") route(); };
$("#aOut").onclick=async()=>{ await B.signOut(); location.hash=""; };
$("#saveBtn").onclick=saveAll;

/* =========================================================
   ROUTING
   ========================================================= */
function showHome(anchor){
  const was=view; view="home";
  $("#admin").style.display="none"; $("#site").style.display="block"; $("#viewHome").style.display="block"; $("#viewDash").style.display="none";
  if(was!=="home"){ renderHome(); if(anchor) setTimeout(()=>{ const el=document.getElementById(anchor); if(el) el.scrollIntoView(); },40); else window.scrollTo(0,0); }
}
function route(){
  const h=location.hash;
  if(h==="#admin") showAdmin(); else if(h==="#dashboard") showDash(); else showHome(h.slice(1));
}
window.addEventListener("hashchange",route);

(async()=>{
  try{ B = FIREBASE_CONFIG ? await firebaseBackend() : demoBackend(); }
  catch(e){ console.warn(e); B=demoBackend(); }
  try{ site=normalizeSite(await B.getSite()); }catch(e){ console.warn(e); site=normalizeSite(null); }
  B.onAuth(async u=>{
    me=u; isAdmin=!!(u&&ADMIN_EMAILS.map(x=>x.toLowerCase()).includes((u.email||"").toLowerCase())); profile=null;
    if(me){ try{ profile=await B.getProfile(me.uid); }catch{} if(profile&&profile.name) me.name=profile.name; }
    updateAuthBtn();
    if(view==="dash") showDash(); else if(view==="admin") showAdmin();
  });
  renderHeader(); route(); bindAdmin();
})();
